# O repositório apt (https://canela-san.github.io/SH-Analyzer): a cada release publicada (e à mão), os .deb das três
# últimas releases são postos num repositório assinado (empacotamento/repositorio_apt.py, com a chave do segredo
# APT_CHAVE_GPG) e publicados no GitHub Pages. Depois, os comandos do README são conferidos contra o repositório
# publicado, em contêineres limpos do Ubuntu e do Debian.
#
# Quem instalou pelo apt recebe a versão nova pelo Atualizador do sistema (ou `sudo apt upgrade`).
name: Repositório apt

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: apt
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSOES: 3   # as últimas releases no repositório (~120 MB cada; o Pages aceita até 1 GB)

jobs:
  montar:
    name: montar e assinar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Os .deb das últimas releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 20 \
              --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags"
          baixadas=0
          while read -r tag && (( baixadas < VERSOES )); do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'sh-analyzer_*_amd64.deb' \
                --dir "$RUNNER_TEMP/debs"; then
              baixadas=$((baixadas + 1))
            fi
          done < "$RUNNER_TEMP/tags"
          ls -l "$RUNNER_TEMP/debs"
          (( baixadas > 0 )) || { echo "::error::nenhuma release publicada com um .deb"; exit 1; }

      - name: Montar e assinar
        env:
          APT_CHAVE_GPG: ${{ secrets.APT_CHAVE_GPG }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_CHAVE_GPG" | gpg --batch --quiet --import
          chave=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          python3 empacotamento/repositorio_apt.py --chave "$chave" "$RUNNER_TEMP/debs" "$RUNNER_TEMP/site"
          du -sh "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  publicar:
    name: publicar no Pages
    needs: montar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4

  conferir:
    name: instalar pelo apt no ${{ matrix.imagem }}
    needs: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        imagem: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v5

      - name: Os comandos do README
        run: |
          url=$(python3 -c 'import sys; sys.path.insert(0, "empacotamento"); import deb; print(deb.URL_DO_REPOSITORIO)')
          docker run --rm -v "$PWD/empacotamento:/e:ro" "${{ matrix.imagem }}" /e/testar_no_conteiner.sh repositorio "$url"
