# Integração contínua: a cada push na main e a cada pull request, roda o ruff e a suíte de testes no menor e no
# maior Python suportados, e confere o firmware que dá para conferir fora da BeagleBone (o C do ARM e os scripts
# de shell; o clpru da PRU é proprietário e fica de fora). Os comandos estão em scripts/ci.sh, que roda igual na
# sua máquina: `scripts/ci.sh` (tudo) ou `scripts/ci.sh rapido`. Detalhes em docs/software-architecture.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: testes (Python ${{ matrix.python }})
    # Versão fixa do Ubuntu (e não ubuntu-latest): a troca de imagem não muda as ferramentas sem aviso.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # 3.10 = mínimo declarado em pyproject.toml (requires-python)
    steps:
      - uses: actions/checkout@v5

      - name: Instalar o uv
        run: pipx install uv

      # zpaq: o compressor do scripts/compactar_amostras.py (sem ele, os testes que o usam são pulados).
      # gcc-arm-linux-gnueabihf: o teste que compila o ler_adc.c para o ARM de 32 bits da BeagleBone (sem ele, pulado).
      # As bibliotecas do sistema que o Qt (PyQt6, a interface gráfica) precisa para rodar sem tela
      # (QT_QPA_PLATFORM=offscreen) nos testes do tests/test_gui.py.
      - name: Instalar o zpaq, o compilador cruzado do ARM e as bibliotecas do Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zpaq gcc-arm-linux-gnueabihf libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: ruff e pytest
        run: scripts/ci.sh testes ${{ matrix.python }}

  firmware:
    name: firmware (C do ARM e scripts de shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # O uv baixa o shellcheck na versão fixada em scripts/ci.sh (a do apt do Ubuntu é outra).
      - name: Instalar o uv
        run: pipx install uv

      # O compilador cruzado: o ler_adc.c também é compilado para o ARM de 32 bits (o off_t de 64 bits, os tipos).
      - name: Instalar o compilador cruzado do ARM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf

      # O ler_adc roda num Cortex-A8, mas o código é C/POSIX portável: compilar no x86 já pega erro de sintaxe,
      # de tipo e aviso que só apareceriam no `make` da BeagleBone.
      - name: gcc -Werror no ler_adc.c (x86 e ARM de 32 bits) e shellcheck
        run: scripts/ci.sh firmware
