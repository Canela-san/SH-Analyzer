[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sh-analyzer"
version = "0.1.0"
description = "Pós-processamento das capturas do SH-Analyzer (ADS8688 + BeagleBone Black/PRU): conversão, espectro (FFT/Welch), supraharmônicos e correção de sondas."
readme = "README.md"
requires-python = ">=3.10"
# Estas dependências precisam ficar IGUAIS às dos blocos PEP 723 (# /// script)
# de scripts/adc_tool.py e scripts/gerar_perfil_sonda.py -- tests/test_dependencias.py confere.
dependencies = [
    "numpy>=1.20",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "h5py>=3.0",
]

[project.optional-dependencies]
# Backend gráfico interativo (plt.show() sem -o); não é necessário para salvar PNG.
gui = ["PyQt6"]
# tomli: leitor de TOML dos testes na Python 3.10 (a partir da 3.11 ele vem na biblioteca padrão).
dev = ["pytest>=8", "ruff>=0.6", "tomli>=2; python_version < '3.11'"]

# A lógica mora no pacote scripts/supraharmonicos; scripts/adc_tool.py e
# scripts/gerar_perfil_sonda.py são só entradas de linha de comando. Para usar o
# pacote como biblioteca (notebooks, outros scripts):  pip install -e .
# (modo editável: a pasta padrão de perfis, scripts/sondas/, fica ao lado do pacote).
[tool.setuptools.packages.find]
where = ["scripts"]
include = ["supraharmonicos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "-ra"
markers = [
    "e2e: roda os scripts de ponta a ponta via subprocess (lento, dezenas de segundos)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["firmware"]

[tool.ruff.lint]
# E/W: estilo básico; F: erros reais (nomes indefinidos, imports mortos); I: ordem de
# imports; UP: sintaxe moderna; B: armadilhas comuns; T20: proíbe print() em código
# de biblioteca (use logging -- ver supraharmonicos/registro.py).
select = ["E", "W", "F", "I", "UP", "B", "T20"]
ignore = [
    "E501",   # comentários/strings longos em português fazem parte do estilo do projeto
    "B904",   # 'raise ... from' dentro de except: nem sempre agrega nas mensagens de erro ao usuário
    "B905",   # zip(strict=...): os zips do projeto já têm tamanhos garantidos por validação anterior
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
