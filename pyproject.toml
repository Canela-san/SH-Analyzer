[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sh-analyzer"
version = "0.8.0"
description = "Pós-processamento das capturas do SH-Analyzer (ADS8688 + BeagleBone Black/PRU): conversão, espectro (FFT/Welch), supraharmônicos e correção de sondas."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gabriel Canela" }]
license = { text = "MIT" }
# Estas dependências precisam ficar IGUAIS às dos blocos PEP 723 (# /// script) de scripts/adc_tool.py,
# scripts/gerar_perfil_sonda.py, scripts/medir_captura.py e scripts/compactar_amostras.py -- tests/test_dependencias.py confere.
# rich: a interface do compactar_amostras (tabelas, barras de progresso); só cli_compactar o importa.
dependencies = [
    "numpy>=1.20",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "h5py>=3.0",
    "rich>=13.7",
]

[project.urls]
Repository = "https://github.com/Canela-san/SH-Analyzer"
Documentation = "https://github.com/Canela-san/SH-Analyzer/tree/main/docs"

[project.optional-dependencies]
# A interface gráfica (sh-analyzer-gui) e o backend interativo do matplotlib (plt.show() sem -o; para salvar PNG
# não é necessário). PySide6, e não PyQt6: a LGPL do Qt for Python é compatível com a licença MIT do projeto, e a
# GPL do PyQt6 não (docs/gui-plan.md, seção 5). O PyQtGraph 0.14 traz o OpenGL moderno (o plano B do motor de
# gráficos, seção 6.7); o platformdirs dá a pasta de cache do sistema (as pirâmides).
gui = ["PySide6>=6.8", "pyqtgraph>=0.14", "platformdirs>=4"]
# tomli: leitor de TOML dos testes na Python 3.10 (a partir da 3.11 ele vem na biblioteca padrão).
# pytest-xdist: a suíte roda em paralelo (-n auto, em addopts); pytest-cov: cobertura (--cov=scripts/supraharmonicos).
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-cov>=5", "ruff>=0.6", "tomli>=2; python_version < '3.11'"]
# Os testes da interface (pytest-qt). Fora do dev: o pytest-qt recusa iniciar sem um Qt instalado, e os jobs da CI
# que não testam a interface não instalam o Qt.
gui-dev = ["sh-analyzer[gui,dev]", "pytest-qt>=4.4"]

# A interface gráfica: no Windows, um gui-script abre sem a janela do console.
[project.gui-scripts]
sh-analyzer-gui = "sh_analyzer_gui.app:main"

# A lógica mora no pacote scripts/supraharmonicos; scripts/adc_tool.py, scripts/gerar_perfil_sonda.py,
# scripts/medir_captura.py e scripts/compactar_amostras.py são só entradas de linha de comando. A interface gráfica
# é o pacote scripts/sh_analyzer_gui, que chama o supraharmonicos (nunca o contrário). Para usar o pacote como
# biblioteca (notebooks, outros scripts):  pip install -e .
# (modo editável: a pasta padrão de perfis, scripts/sondas/, fica ao lado do pacote).
[tool.setuptools.packages.find]
where = ["scripts"]
include = ["supraharmonicos*", "sh_analyzer_gui*"]

# O ícone da marca vai junto do pacote da interface (cópia de docs/images/, conferida por tests/test_marca.py).
[tool.setuptools.package-data]
sh_analyzer_gui = ["recursos/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
# -n auto: um processo por núcleo (6 min -> ~1 min na máquina de desenvolvimento). worksteal: quem termina antes
# rouba testes de quem está atrasado (os da calibração e do perfil levam segundos cada). Para depurar um teste
# com breakpoint/pdb, desligue o paralelismo: pytest -n0 tests/test_x.py::test_y
addopts = "-ra -n auto --dist worksteal"
markers = [
    "e2e: roda os scripts de ponta a ponta via subprocess (lento, dezenas de segundos)",
    "desempenho: mede tempo e memória da interface (docs/gui-plan.md, seção 6.7); só roda com --desempenho",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["firmware"]

[tool.ruff.lint]
# E/W: estilo básico; F: erros reais (nomes indefinidos, imports mortos); I: ordem de
# imports; UP: sintaxe moderna; B: armadilhas comuns; T20: proíbe print() em código
# de biblioteca (use logging -- ver supraharmonicos/registro.py).
select = ["E", "W", "F", "I", "UP", "B", "T20"]
ignore = [
    "E501",   # comentários/strings longos em português fazem parte do estilo do projeto
    "B904",   # 'raise ... from' dentro de except: nem sempre agrega nas mensagens de erro ao usuário
    "B905",   # zip(strict=...): os zips do projeto já têm tamanhos garantidos por validação anterior
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
